 <!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Nurlink</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
 --bg:#f4f6f8;
 --card:#fff;
 --text:#111827;
 --muted:#6b7280;
 --border:#e5e7eb;
 --blue:#2563eb;
 --danger:#ef4444;
}

*{box-sizing:border-box}

body{
 margin:0;
 font-family:Arial,sans-serif;
 background:var(--bg);
 color:var(--text);
}

body.dark{
 --bg:#0b1120;
 --card:#111827;
 --text:#f9fafb;
 --muted:#9ca3af;
 --border:#263244;
}

button,input,textarea{font:inherit}

button{cursor:pointer}

.hidden{display:none!important}

.auth-page{
 min-height:100vh;
 display:flex;
 align-items:center;
 justify-content:center;
 padding:20px;
 background:linear-gradient(135deg,#172554,#2563eb,#7c3aed);
}

.auth-card{
 width:100%;
 max-width:420px;
 background:var(--card);
 padding:32px;
 border-radius:25px;
 box-shadow:0 25px 70px #0005;
}

.logo{
 text-align:center;
 font-size:42px;
 font-weight:900;
}

.logo span,.nav-logo span{color:#2563eb}

.tagline{
 text-align:center;
 color:var(--muted);
 margin:8px 0 28px;
}

.auth-title{margin-bottom:18px}

.input{
 width:100%;
 padding:13px 15px;
 margin-bottom:12px;
 border:1px solid var(--border);
 border-radius:12px;
 outline:none;
 background:var(--card);
 color:var(--text);
}

.input:focus{border-color:var(--blue)}

.primary{
 width:100%;
 padding:13px;
 border:0;
 border-radius:12px;
 background:var(--blue);
 color:white;
 font-weight:bold;
}

.auth-switch{
 text-align:center;
 margin-top:18px;
 color:var(--muted);
}

.link-btn{
 border:0;
 background:none;
 color:var(--blue);
 font-weight:bold;
}

.navbar{
 height:65px;
 position:sticky;
 top:0;
 z-index:100;
 display:flex;
 align-items:center;
 justify-content:space-between;
 padding:0 20px;
 background:var(--card);
 border-bottom:1px solid var(--border);
}

.nav-logo{
 font-size:28px;
 font-weight:900;
 cursor:pointer;
}

.nav-actions{
 display:flex;
 gap:5px;
}

.nav-btn{
 border:0;
 background:transparent;
 color:var(--text);
 padding:10px;
 border-radius:10px;
}

.nav-btn:hover{background:var(--bg)}

.layout{
 max-width:1150px;
 margin:auto;
 display:grid;
 grid-template-columns:220px minmax(0,650px) 220px;
 gap:20px;
 padding:20px 15px;
}

.sidebar,.rightbar{
 position:sticky;
 top:85px;
 height:max-content;
}

.side-card,.info-card,.create-card,.post,.stories-section,.profile-card,.search-card,.chat-card{
 background:var(--card);
 border:1px solid var(--border);
 border-radius:18px;
 box-shadow:0 5px 20px #00000008;
}

.side-card{padding:12px}

.side-user{
 display:flex;
 align-items:center;
 gap:10px;
 padding:10px;
}

.side-menu{
 display:flex;
 flex-direction:column;
}

.side-menu button{
 border:0;
 background:transparent;
 color:var(--text);
 text-align:left;
 padding:12px;
 border-radius:10px;
 font-weight:bold;
}

.side-menu button:hover{background:var(--bg)}

.info-card{padding:18px}

.info-card p{
 color:var(--muted);
 line-height:1.5;
}

.avatar{
 width:45px;
 height:45px;
 min-width:45px;
 border-radius:50%;
 display:flex;
 align-items:center;
 justify-content:center;
 background:linear-gradient(135deg,#2563eb,#7c3aed);
 color:white;
 font-weight:bold;
 overflow:hidden;
}

.avatar.small{
 width:38px;
 height:38px;
 min-width:38px;
}

.avatar.large{
 width:110px;
 height:110px;
 min-width:110px;
 font-size:40px;
}

.avatar img{
 width:100%;
 height:100%;
 object-fit:cover;
}

/* STORIES */

.stories-section{
 padding:15px;
 margin-bottom:18px;
}

.stories-title{
 display:flex;
 justify-content:space-between;
 align-items:center;
 margin-bottom:13px;
}

.stories-title b{font-size:18px}

.stories-list{
 display:flex;
 gap:12px;
 overflow-x:auto;
}

.stories-list::-webkit-scrollbar{display:none}

.story,.add-story{
 width:78px;
 min-width:78px;
 height:105px;
 border-radius:15px;
 overflow:hidden;
 position:relative;
}

.story{
 padding:3px;
 background:linear-gradient(135deg,#2563eb,#ec4899);
 cursor:pointer;
}

.story img{
 width:100%;
 height:100%;
 object-fit:cover;
 border-radius:12px;
}

.story-name{
 position:absolute;
 bottom:0;
 left:0;
 right:0;
 padding:18px 5px 6px;
 color:white;
 font-size:11px;
 font-weight:bold;
 background:linear-gradient(transparent,#000b);
}

.add-story{
 display:flex;
 flex-direction:column;
 align-items:center;
 justify-content:center;
 background:var(--bg);
 border:2px dashed var(--border);
 color:var(--blue);
 cursor:pointer;
}

.add-story span{font-size:30px}

.add-story small{
 color:var(--muted);
 font-size:10px;
}

.stories-loading{
 color:var(--muted);
 padding:15px;
 text-align:center;
}

/* STORY VIEWER */

.story-modal{
 position:fixed;
 inset:0;
 z-index:9999;
 background:#000e;
 display:flex;
 align-items:center;
 justify-content:center;
}

.story-viewer{
 height:90vh;
 width:100%;
 max-width:430px;
 position:relative;
 display:flex;
 align-items:center;
 justify-content:center;
}

.story-viewer img{
 max-height:100%;
 max-width:100%;
 object-fit:contain;
 border-radius:15px;
}

.story-close{
 position:absolute;
 top:10px;
 right:5px;
 z-index:5;
 width:40px;
 height:40px;
 border:0;
 border-radius:50%;
 background:#ffffff22;
 color:white;
 font-size:27px;
}

.story-arrow{
 position:absolute;
 top:50%;
 transform:translateY(-50%);
 width:42px;
 height:42px;
 border:0;
 border-radius:50%;
 background:#ffffff22;
 color:white;
 font-size:28px;
 z-index:5;
}

.story-prev{left:-55px}
.story-next{right:-55px}

.story-counter{
 position:absolute;
 top:15px;
 left:50%;
 transform:translateX(-50%);
 color:white;
 background:#0008;
 padding:5px 10px;
 border-radius:10px;
 font-size:12px;
}

.story-delete{
 position:absolute;
 bottom:15px;
 right:5px;
 border:0;
 border-radius:10px;
 background:#ef4444;
 color:white;
 padding:10px 14px;
 font-weight:bold;
}

/* CREATE POST */

.create-card{
 padding:18px;
 margin-bottom:18px;
}

.create-top{
 display:flex;
 gap:12px;
}

.create-text{
 flex:1;
 min-height:60px;
 resize:none;
 border:0;
 outline:0;
 background:transparent;
 color:var(--text);
}

.preview{
 margin-top:12px;
}

.preview img{
 width:100%;
 max-height:400px;
 object-fit:cover;
 border-radius:14px;
}

.create-bottom{
 border-top:1px solid var(--border);
 margin-top:10px;
 padding-top:12px;
 display:flex;
 justify-content:space-between;
}

.photo-label{
 padding:9px 12px;
 border-radius:10px;
 background:var(--bg);
 font-weight:bold;
 cursor:pointer;
}

.publish-btn{
 padding:10px 17px;
 border:0;
 border-radius:10px;
 background:var(--blue);
 color:white;
 font-weight:bold;
}

/* POSTS */

.post{
 padding:18px;
 margin-bottom:18px;
}

.post-header{
 display:flex;
 gap:10px;
 align-items:center;
}

.post-author{font-weight:bold}

.post-username,.post-date{
 color:var(--muted);
 font-size:12px;
}

.post-content{
 margin-top:15px;
 line-height:1.55;
 white-space:pre-wrap;
 overflow-wrap:anywhere;
}

.post-image{
 width:100%;
 max-height:550px;
 object-fit:cover;
 margin-top:14px;
 border-radius:15px;
}

.post-actions{
 display:flex;
 gap:5px;
 border-top:1px solid var(--border);
 margin-top:15px;
 padding-top:10px;
}

.action{
 border:0;
 background:transparent;
 color:var(--muted);
 padding:9px;
 border-radius:9px;
}

.action:hover{background:var(--bg)}

.action.liked{color:#ef4444}

.delete{margin-left:auto}

/* COMMENTS */

.comments{
 border-top:1px solid var(--border);
 margin-top:10px;
 padding-top:10px;
}

.comment{
 display:flex;
 gap:8px;
 margin-bottom:10px;
}

.comment-content{
 background:var(--bg);
 padding:8px 10px;
 border-radius:10px;
 flex:1;
}

.comment-name{
 font-size:12px;
 font-weight:bold;
}

.comment-input-row{
 display:flex;
 gap:7px;
}

.comment-input{
 flex:1;
 padding:10px;
 border:1px solid var(--border);
 border-radius:10px;
 background:var(--card);
 color:var(--text);
}

.comment-send{
 border:0;
 background:var(--blue);
 color:white;
 border-radius:10px;
 padding:0 14px;
}

/* PROFILE */

.profile-card{
 padding:25px;
 text-align:center;
 margin-bottom:18px;
}

.profile-card .avatar{margin:auto}

.profile-name{
 font-size:27px;
 font-weight:900;
 margin-top:12px;
}

.profile-username{color:var(--muted)}

.bio{
 max-width:500px;
 margin:15px auto;
 color:var(--muted);
 line-height:1.5;
}

.stats{
 display:flex;
 justify-content:center;
 gap:45px;
 margin:20px;
}

.stat strong{
 display:block;
 font-size:20px;
}

.stat span{
 color:var(--muted);
 font-size:12px;
}

.outline{
 padding:10px 16px;
 border:1px solid var(--border);
 background:var(--card);
 color:var(--text);
 border-radius:10px;
 font-weight:bold;
}

/* SEARCH */

.search-card{
 padding:18px;
 margin-bottom:15px;
}

.search-input{
 width:100%;
 padding:13px;
 margin-top:10px;
 border:1px solid var(--border);
 border-radius:12px;
 background:var(--card);
 color:var(--text);
}

.user-result{
 display:flex;
 justify-content:space-between;
 align-items:center;
 padding:12px;
 margin-bottom:10px;
 background:var(--card);
 border:1px solid var(--border);
 border-radius:14px;
}

.user-info{
 display:flex;
 gap:10px;
 align-items:center;
}

.user-name{font-weight:bold}
.user-handle{font-size:12px;color:var(--muted)}

/* CHAT */

.chat-card{overflow:hidden}

.chat-header{
 display:flex;
 align-items:center;
 gap:10px;
 padding:15px;
 border-bottom:1px solid var(--border);
}

.chat-messages{
 height:450px;
 overflow-y:auto;
 padding:15px;
 display:flex;
 flex-direction:column;
 gap:8px;
}

.chat-message{
 max-width:75%;
 padding:10px 13px;
 border-radius:14px;
 overflow-wrap:anywhere;
}

.mine{
 align-self:flex-end;
 background:var(--blue);
 color:white;
}

.theirs{
 align-self:flex-start;
 background:var(--bg);
}

.chat-input-row{
 display:flex;
 gap:8px;
 padding:12px;
 border-top:1px solid var(--border);
}

.chat-input{
 flex:1;
 padding:12px;
 border:1px solid var(--border);
 border-radius:11px;
 background:var(--card);
 color:var(--text);
}

.chat-send{
 border:0;
 background:var(--blue);
 color:white;
 border-radius:11px;
 padding:0 16px;
}

/* MODAL */

.modal{
 position:fixed;
 inset:0;
 z-index:1000;
 background:#0009;
 display:flex;
 align-items:center;
 justify-content:center;
 padding:20px;
}

.modal-box{
 width:100%;
 max-width:500px;
 background:var(--card);
 border-radius:20px;
 padding:22px;
}

.modal-head{
 display:flex;
 justify-content:space-between;
 margin-bottom:18px;
}

.close{
 border:0;
 background:var(--bg);
 color:var(--text);
 width:35px;
 height:35px;
 border-radius:50%;
 font-size:20px;
}

.loading{
 text-align:center;
 color:var(--muted);
 padding:50px;
}

.toast{
 position:fixed;
 z-index:10000;
 bottom:25px;
 left:50%;
 transform:translate(-50%,100px);
 background:#111827;
 color:white;
 padding:13px 18px;
 border-radius:12px;
 opacity:0;
 transition:.3s;
}

.toast.show{
 transform:translate(-50%,0);
 opacity:1;
}

@media(max-width:900px){
 .layout{grid-template-columns:1fr}
 .sidebar,.rightbar{display:none}
 .story-prev{left:5px}
 .story-next{right:5px}
}

@media(max-width:600px){
 .navbar{padding:0 10px}
 .nav-logo{font-size:23px}
 .layout{padding:10px 8px}
 .mobile-label{display:none}
 .story-viewer{height:85vh}
}
</style>
</head>

<body>

<input
 id="loginEmail"
 class="input"

<input

<input

 id="regEmail"
 class="input"
 type="email"
 placeholder="Email">

 id="regPassword"

🏠

<div class="layout">

<div class="modal-head">

<h2>Редактировать профиль</h2>

<button class="close" onclick="closeEdit()">×</button>

<input
 id="editName"
 class="input"
 placeholder="Имя">

 id="editAvatar"
 class="input"
 placeholder="Ссылка на аватар">

 id="editBio"
 class="input"
 placeholder="О себе"
 rows="4">

Сохранить
</button>

<div id="toast" class="toast"></div>


<script>

/* ================================
SUPABASE
================================ */

const SUPABASE_URL=
"https://yaycdogysqslorprxhgs.supabase.co";

const SUPABASE_KEY=
"sb_publishable_zby9kHgYS0i-KTBFKswqDA_P2XMlWuy";

const supabaseClient=
window.supabase.createClient(
 SUPABASE_URL,
 SUPABASE_KEY
);


/* ================================
STATE
================================ */

let currentUser=null;
let currentProfile=null;
let selectedImage=null;
let chatUser=null;

let storyItems=[];
let currentStoryIndex=0;


/* ================================
HELPERS
================================ */

function $(id){
 return document.getElementById(id);
}

function escapeHTML(value){

 if(value===null||value===undefined)
  return "";

 return String(value)
 .replaceAll("&","&amp;")
 .replaceAll("<","&lt;")
 .replaceAll(">","&gt;")
 .replaceAll('"',"&quot;")
 .replaceAll("'","&#039;");
}

function toast(text){

 $("toast").textContent=text;

 $("toast").classList.add("show");

 setTimeout(()=>{
  $("toast").classList.remove("show");
 },2500);
}

function avatarHTML(profile,size="normal"){

 let cls="avatar";

 if(size==="small")
  cls+=" small";

 if(size==="large")
  cls+=" large";

 if(profile?.avatar_url){

  return `
  <div class="${cls}">
   <img
    src="${escapeHTML(profile.avatar_url)}"
    onerror="this.style.display='none'">
  </div>`;
 }

 const name=
 profile?.display_name||
 profile?.username||
 "?";

 return `
 <div class="${cls}">
  ${escapeHTML(
   name.charAt(0).toUpperCase()
  )}
 </div>`;
}

function timeAgo(date){

 const seconds=
 Math.floor(
  (Date.now()-new Date(date).getTime())/1000
 );

 if(seconds<60)
  return "только что";

 if(seconds<3600)
  return Math.floor(seconds/60)+" мин";

 if(seconds<86400)
  return Math.floor(seconds/3600)+" ч";

 return Math.floor(seconds/86400)+" дн";
}


/* ================================
AUTH
================================ */

function showRegister(){

 $("loginBox").classList.add("hidden");
 $("registerBox").classList.remove("hidden");
}

function showLogin(){

 $("registerBox").classList.add("hidden");
 $("loginBox").classList.remove("hidden");
}

function showApp(){

 $("authPage").classList.add("hidden");
 $("app").classList.remove("hidden");
}

function showAuth(){

 $("app").classList.add("hidden");
 $("authPage").classList.remove("hidden");
}


/* ================================
REGISTER
================================ */

async function register(){

 const name=
 $("regName").value.trim();

 const username=
 $("regUsername")
 .value
 .trim()
 .toLowerCase();

 const email=
 $("regEmail").value.trim();

 const password=
 $("regPassword").value;

 if(!name||!username||!email||!password){

  toast("Заполни все поля");

  return;
 }

 if(!/^[a-z0-9_]+$/.test(username)){

  toast(
   "Username: английские буквы, цифры и _"
  );

  return;
 }

 if(password.length<6){

  toast("Пароль минимум 6 символов");

  return;
 }

 const {
  data:existing,
  error:existingError
 }=
 await supabaseClient
 .from("profiles")
 .select("id")
 .eq("username",username)
 .maybeSingle();

 if(existingError){

  toast(existingError.message);

  return;
 }

 if(existing){

  toast("Username уже занят");

  return;
 }

 const {
  data,
  error
 }=
 await supabaseClient.auth.signUp({

  email,
  password,

  options:{
   data:{
    display_name:name,
    username:username
   }
  }

 });

 if(error){

  toast(error.message);

  return;
 }

 if(!data.user){

  toast("Ошибка регистрации");

  return;
 }

 if(data.session){

  const {
   error:profileError
  }=
  await supabaseClient
  .from("profiles")
  .insert({

   id:data.user.id,
   username,
   display_name:name,
   bio:"",
   avatar_url:""

  });

  if(profileError){

   toast(profileError.message);

   return;
  }

  currentUser=data.user;

  await loadApp();

 }else{

  toast(
   "Проверь почту для подтверждения 📧"
  );
 }
}


/* ================================
LOGIN
================================ */

async function login(){

 const email=
 $("loginEmail").value.trim();

 const password=
 $("loginPassword").value;

 if(!email||!password){

  toast("Введи email и пароль");

  return;
 }

 const {
  data,
  error
 }=
 await supabaseClient.auth.signInWithPassword({

  email,
  password

 });

 if(error){

  toast(error.message);

  return;
 }

 currentUser=data.user;

 await loadApp();
}


/* ================================
LOAD APP
================================ */

async function loadApp(){

 const {
  data:{user}
 }=
 await supabaseClient.auth.getUser();

 if(!user){

  showAuth();

  return;
 }

 currentUser=user;

 const {
  data:profile,
  error
 }=
 await supabaseClient
 .from("profiles")
 .select("*")
 .eq("id",user.id)
 .maybeSingle();

 if(error){

  toast(error.message);

  return;
 }

 currentProfile=profile;

 if(!profile){

  const username=
  user.user_metadata?.username||
  "user"+Date.now();

  const name=
  user.user_metadata?.display_name||
  "User";

  const {
   data:created,

/* ================================
STORIES LOAD
================================ */

async function loadStories(){

 const box=$("storiesList");

 if(!box)
  return;

 const expire=
 new Date(
  Date.now()-24*60*60*1000
 ).toISOString();

 const {
  data,
  error
 }=
 await supabaseClient
 .from("stories")
 .select(`
  *,
  profiles(
   id,
   username,
   display_name,
   avatar_url
  )
 `)
 .gte("created_at",expire)
 .order("created_at",{ascending:false});

 if(error){

  console.error(error);

  box.innerHTML=`
   <div class="stories-loading">
    Ошибка загрузки Stories
   </div>`;

  return;
 }

 if(!data?.length){

  box.innerHTML=`
   <div class="stories-loading">
    Пока нет Stories 👀
   </div>`;

  return;
 }

 box.innerHTML="";

 const groups=new Map();

 data.forEach(story=>{

  if(!groups.has(story.user_id))
   groups.set(story.user_id,[]);

  groups
  .get(story.user_id)
  .push(story);
 });


 groups.forEach(userStories=>{

  const story=userStories[0];

  const profile=story.profiles||{};

  const div=
  document.createElement("div");

  div.className="story";

  div.innerHTML=`

   <img
    src="${escapeHTML(story.image_url)}">

   <div class="story-name">

    ${escapeHTML(
     profile.display_name||
     profile.username||
     "User"
    )}

   </div>
  `;

  div.onclick=()=>{

   openStoryViewer(userStories);

  };

  box.appendChild(div);
 });
}


/* ================================
UPLOAD STORY
================================ */

async function uploadStory(event){

 const file=event.target.files[0];

 if(!file)
  return;

 if(!file.type.startsWith("image/")){

  toast("Можно загрузить только фото");

  event.target.value="";

  return;
 }

 if(file.size>10*1024*1024){

  toast("Фото должно быть меньше 10 МБ");

  event.target.value="";

  return;
 }

 try{

  toast("Загружаю Story...");

  const extension=
  file.name
  .split(".")
  .pop()
  .toLowerCase();

  const fileName=
  currentUser.id+
  "/"+
  crypto.randomUUID()+
  "."+
  extension;

  const {
   error:uploadError
  }=
  await supabaseClient
  .storage
  .from("stories")
  .upload(
   fileName,
   file,
   {
    cacheControl:"3600",
    upsert:false
   }
  );

  if(uploadError)
   throw uploadError;

  const {
   data:urlData
  }=
  supabaseClient
  .storage
  .from("stories")
  .getPublicUrl(fileName);

  const {
   error:storyError
  }=
  await supabaseClient
  .from("stories")
  .insert({

   user_id:currentUser.id,
   image_url:urlData.publicUrl

  });

  if(storyError)
   throw storyError;

  event.target.value="";

  toast("Story опубликована 🔥");

  await loadStories();

 }catch(error){

  console.error(error);

  toast(
   "Ошибка: "+error.message
  );
 }
}


/* ================================
STORY VIEWER
================================ */

function openStoryViewer(stories){

 storyItems=stories;
 currentStoryIndex=0;

 renderStoryViewer();
}


function renderStoryViewer(){

 if(!storyItems.length)
  return;

 const story=
 storyItems[currentStoryIndex];

 const modal=
 document.createElement("div");

 modal.className="story-modal";

 const mine=
 story.user_id===
 currentUser.id;

 modal.innerHTML=`

 <div class="story-viewer">

  <button
   class="story-close"
   onclick="closeStoryViewer()">

   ×

  </button>

  ${
   storyItems.length>1
   ?
   `

   <button
    class="story-arrow story-prev"
    onclick="previousStory()">

    ‹

   </button>

   <button
    class="story-arrow story-next"
    onclick="nextStory()">

    ›

   </button>

   `
   :
   ""
  }

  <div class="story-counter">

   ${currentStoryIndex+1}
   /
   ${storyItems.length}

  </div>

  <img
   src="${escapeHTML(
    story.image_url
   )}">

  ${
   mine
   ?
   `
   <button
    class="story-delete"
    onclick="deleteStory(${story.id})">

    🗑️ Удалить

   </button>
   `
   :
   ""
  }

 </div>
 `;

 modal.id="storyViewer";

 modal.onclick=e=>{

  if(e.target===modal)
   closeStoryViewer();
 };

 document.body.appendChild(modal);
}


function closeStoryViewer(){

 const modal=$("storyViewer");

 if(modal)
  modal.remove();
}


function previousStory(){

 if(currentStoryIndex>0){

  currentStoryIndex--;

  closeStoryViewer();

  renderStoryViewer();
 }
}


function nextStory(){

 if(
  currentStoryIndex<
  storyItems.length-1
 ){

  currentStoryIndex++;

  closeStoryViewer();

  renderStoryViewer();
 }
}


/* ================================
DELETE STORY
================================ */

async function deleteStory(id){

 const story=
 storyItems.find(x=>x.id===id);

 if(!story)
  return;

 if(
  story.user_id!==
  currentUser.id
 ){

  toast("Это не твоя Story");

  return;
 }

 if(!confirm("Удалить Story?"))
  return;

 const {
  error
 }=
 await supabaseClient
 .from("stories")
 .delete()
 .eq("id",id)
 .eq("user_id",currentUser.id);

 if(error){

  toast(error.message);

  return;
 }

 storyItems=
 storyItems.filter(x=>x.id!==id);

 if(!storyItems.length){

  closeStoryViewer();

 }else{

  if(
   currentStoryIndex>=
   storyItems.length
  )
   currentStoryIndex=
   storyItems.length-1;

  closeStoryViewer();

  renderStoryViewer();
 }

 await loadStories();

 toast("Story удалена");
}

    <div class="user-handle">

     @${escapeHTML(
      user.username
     )}

    </div>

   </div>

  </div>

  <button
   class="outline"
   onclick="
    showProfile(
     '${user.id}'
    )
   ">

   Открыть

  </button>

 </div>

 `).join("");
}


/* ================================
EDIT PROFILE
================================ */

function openEdit(){

 $("editName").value=
 currentProfile?.display_name||"";

 $("editAvatar").value=
 currentProfile?.avatar_url||"";

 $("editBio").value=
 currentProfile?.bio||"";

 $("editModal")
 .classList
 .remove("hidden");
}


function closeEdit(){

 $("editModal")
 .classList
 .add("hidden");
}


async function saveProfile(){

 const name=
 $("editName").value.trim();

 const avatar=
 $("editAvatar").value.trim();

 const bio=
 $("editBio").value.trim();

 if(!name){

  toast("Введите имя");

  return;
 }

 const {
  data,
  error
 }=
 await supabaseClient
 .from("profiles")
 .update({

  display_name:name,
  avatar_url:avatar,
  bio:bio

 })
 .eq("id",currentUser.id)
 .select()
 .single();

 if(error){

  toast(error.message);

  return;
 }

 currentProfile=data;

 updateSideUser();

 closeEdit();

 toast("Профиль обновлён ✅");

 showProfile();
}


/* ================================
CHAT
================================ */

async function openChat(userId){

 const {
  data:user,
  error
 }=
 await supabaseClient
 .from("profiles")
 .select("*")
 .eq("id",userId)
 .single();

 if(error){

  toast(error.message);

  return;
 }

 chatUser=user;

 $("content").innerHTML=`

 <div class="chat-card">

  <div class="chat-header">

   ${avatarHTML(user,"small")}

   <div>

    <b>
     ${escapeHTML(
      user.display_name
     )}
    </b>

    <div style="
     color:var(--muted);
     font-size:12px">

     @${escapeHTML(
      user.username
     )}

    </div>

   </div>

  </div>

  <div
   id="chatMessages"
   class="chat-messages">

   Загрузка...

  </div>

  <div class="chat-input-row">

   <input
    id="chatInput"
    class="chat-input"
    placeholder="Написать сообщение..."
    onkeydown="
     if(event.key==='Enter')
      sendMessage()
    ">

   <button
    class="chat-send"
    onclick="sendMessage()">

    ➤

   </button>

  </div>

 </div>

 `;

 loadChat();
}


async function loadChat(){

 if(!chatUser)
  return;

 const {
  data,
  error
 }=
 await supabaseClient
 .from("messages")
 .select("*")
 .or(
  `and(sender_id.eq.${currentUser.id},receiver_id.eq.${chatUser.id}),and(sender_id.eq.${chatUser.id},receiver_id.eq.${currentUser.id})`
 )
 .order(
  "created_at",
  {ascending:true}
 );

 const box=$("chatMessages");

 if(error){

  box.innerHTML=
  `<div>${escapeHTML(error.message)}</div>`;

  return;
 }

 if(!data?.length){

  box.innerHTML=`
   <div style="
    color:var(--muted);
    text-align:center">

    Начните общение 👋

   </div>`;

  return;
 }

 box.innerHTML=data.map(message=>`

  <div class="
   chat-message
   ${
    message.sender_id===
    currentUser.id
    ?
    "mine"
    :
    "theirs"
   }">

   ${escapeHTML(
    message.content
   )}

  </div>

 `).join("");

 box.scrollTop=box.scrollHeight;
}


async function sendMessage(){

 const input=$("chatInput");

 const text=
 input.value.trim();

 if(!text||!chatUser)
  return;

 const {
  error
 }=
 await supabaseClient
 .from("messages")
 .insert({

  sender_id:currentUser.id,
  receiver_id:chatUser.id,
  content:text

 });

 if(error){

  toast(error.message);

  return;
 }

 input.value="";

 loadChat();
}


/* ================================
DARK MODE
================================ */

function toggleDark(){

 document.body.classList.toggle("dark");

 localStorage.setItem(
  "nurlink_dark",
  document.body.classList.contains("dark")
 );
}

if(
 localStorage.getItem("nurlink_dark")==="true"
){

 document.body.classList.add("dark");

}


/* ================================
AUTH STATE
================================ */

supabaseClient.auth.onAuthStateChange(
 async(event,session)=>{

  if(session){

   currentUser=session.user;

   await loadApp();

  }else{

   showAuth();

  }

 }
);

START

(async function(){

 const {
  data:{session}
 }=
 await supabaseClient.auth.getSession();

 if(session){

  currentUser=session.user;

  await loadApp();

 }else{

  showAuth();

 }

})();

</script>
