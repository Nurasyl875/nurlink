 <!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f172a">

<title>Nurlink</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
    --bg:#f5f7fb;
    --card:#ffffff;
    --text:#111827;
    --muted:#6b7280;
    --border:#e5e7eb;
    --blue:#2563eb;
    --blue2:#1d4ed8;
    --danger:#ef4444;
    --shadow:0 8px 30px rgba(15,23,42,.07);
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    transition:.2s;
}

body.dark{
    --bg:#0b1120;
    --card:#111827;
    --text:#f9fafb;
    --muted:#9ca3af;
    --border:#243044;
    --shadow:0 8px 30px rgba(0,0,0,.25);
}

button,
input,
textarea{
    font:inherit;
}

button{
    cursor:pointer;
}

.hidden{
    display:none!important;
}

/* AUTH */

.auth-page{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    background:
        radial-gradient(circle at top left,#3b82f6,transparent 35%),
        radial-gradient(circle at bottom right,#7c3aed,transparent 35%),
        #0f172a;
}

.auth-card{
    width:100%;
    max-width:430px;
    background:var(--card);
    border-radius:28px;
    padding:34px;
    box-shadow:0 25px 70px rgba(0,0,0,.3);
}

.logo{
    text-align:center;
    font-size:42px;
    font-weight:900;
    letter-spacing:-2px;
}

.logo span{
    color:var(--blue);
}

.tagline{
    text-align:center;
    color:var(--muted);
    margin:8px 0 30px;
}

.auth-title{
    font-size:25px;
    margin-bottom:18px;
}

.input{
    width:100%;
    padding:14px 16px;
    border:1px solid var(--border);
    border-radius:14px;
    background:var(--card);
    color:var(--text);
    outline:none;
    margin-bottom:12px;
}

.input:focus{
    border-color:var(--blue);
}

.primary{
    width:100%;
    border:0;
    border-radius:14px;
    padding:14px;
    background:var(--blue);
    color:white;
    font-weight:800;
    transition:.2s;
}

.primary:hover{
    background:var(--blue2);
    transform:translateY(-1px);
}

.auth-switch{
    text-align:center;
    margin-top:20px;
    color:var(--muted);
}

.link-btn{
    border:0;
    background:none;
    color:var(--blue);
    font-weight:800;
}

/* NAV */

.navbar{
    height:68px;
    position:sticky;
    top:0;
    z-index:50;
    background:rgba(255,255,255,.88);
    backdrop-filter:blur(15px);
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 22px;
}

.dark .navbar{
    background:rgba(17,24,39,.88);
}

.nav-logo{
    font-size:27px;
    font-weight:900;
    letter-spacing:-1px;
}

.nav-logo span{
    color:var(--blue);
}

.nav-actions{
    display:flex;
    gap:5px;
}

.nav-btn{
    border:0;
    background:transparent;
    color:var(--text);
    padding:10px 12px;
    border-radius:12px;
    font-weight:700;
}

.nav-btn:hover{
    background:var(--bg);
}

.mobile-label{
    display:inline;
}

/* LAYOUT */

.layout{
    max-width:1120px;
    margin:auto;
    display:grid;
    grid-template-columns:230px minmax(0,650px) 230px;
    gap:20px;
    padding:22px 15px 50px;
}

.sidebar,
.rightbar{
    position:sticky;
    top:90px;
    height:max-content;
}

.side-card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:20px;
    padding:14px;
    box-shadow:var(--shadow);
}

.side-user{
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px;
    margin-bottom:8px;
}

.side-menu{
    display:flex;
    flex-direction:column;
    gap:4px;
}

.side-menu button{
    border:0;
    background:transparent;
    color:var(--text);
    text-align:left;
    padding:13px;
    border-radius:12px;
    font-weight:700;
}

.side-menu button:hover{
    background:var(--bg);
}

.main{
    min-width:0;
}

/* AVATARS */

.avatar{
    width:45px;
    height:45px;
    min-width:45px;
    border-radius:50%;
    background:linear-gradient(135deg,#2563eb,#7c3aed);
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:900;
    overflow:hidden;
}

.avatar.small{
    width:38px;
    height:38px;
    min-width:38px;
}

.avatar.large{
    width:105px;
    height:105px;
    min-width:105px;
    font-size:38px;
}

.avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
}

/* CREATE POST */

.create-card,
.post,
.search-card,
.profile-card,
.info-card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:20px;
    box-shadow:var(--shadow);
}

.create-card{
    padding:18px;
    margin-bottom:18px;
}

.create-top{
    display:flex;
    gap:12px;
}

.create-text{
    width:100%;
    border:0;
    outline:0;
    background:transparent;
    color:var(--text);
    resize:none;
    min-height:55px;
    font-size:16px;
}

.create-bottom{
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-top:1px solid var(--border);
    padding-top:12px;
}

.photo-label{
    border:0;
    background:var(--bg);
    color:var(--text);
    padding:9px 13px;
    border-radius:10px;
    font-weight:700;
}

.photo-label:hover{
    background:var(--border);
}

.publish-btn{
    border:0;
    background:var(--blue);
    color:white;
    padding:10px 18px;
    border-radius:11px;
    font-weight:800;
}

.preview{
    margin-top:12px;
    position:relative;
}

.preview img{
    width:100%;
    max-height:400px;
    object-fit:cover;
    border-radius:15px;
}

/* POSTS */

.post{
    padding:18px;
    margin-bottom:18px;
}

.post-header{
    display:flex;
    align-items:center;
    gap:11px;
}

.post-author{
    font-weight:800;
}

.post-username{
    color:var(--muted);
    font-size:13px;
}

.post-date{
    color:var(--muted);
    font-size:12px;
}

.post-content{
    margin-top:15px;
    line-height:1.55;
    white-space:pre-wrap;
    overflow-wrap:anywhere;
}

.post-image{
    width:100%;
    max-height:520px;
    object-fit:cover;
    border-radius:16px;
    margin-top:15px;
}

.post-actions{
    display:flex;
    gap:7px;
    margin-top:15px;
    padding-top:12px;
    border-top:1px solid var(--border);
}

.action{
    border:0;
    background:transparent;
    color:var(--muted);
    padding:9px 12px;
    border-radius:10px;
    font-weight:700;
}

.action:hover{
    background:var(--bg);
    color:var(--text);
}

.action.liked{
    color:var(--danger);
}

.delete{
    margin-left:auto;
}

/* COMMENTS */

.comments{
    margin-top:14px;
    border-top:1px solid var(--border);
    padding-top:12px;
}

.comment{
    display:flex;
    gap:9px;
    padding:9px 0;
}

.comment-content{
    background:var(--bg);
    border-radius:12px;
    padding:8px 11px;
    flex:1;
}

.comment-name{
    font-size:13px;
    font-weight:800;
}

.comment-input-row{
    display:flex;
    gap:8px;
    margin-top:10px;
}

.comment-input{
    flex:1;
    padding:11px;
    border:1px solid var(--border);
    border-radius:11px;
    background:var(--card);
    color:var(--text);
    outline:none;
}

.comment-send{
    border:0;
    background:var(--blue);
    color:white;
    border-radius:11px;
    padding:0 14px;
}

/* PROFILE */

.profile-card{
    padding:28px;
    text-align:center;
    margin-bottom:18px;
}

.profile-card .avatar{
    margin:0 auto 15px;
}

.profile-name{
    font-size:27px;
    font-weight:900;
}

.profile-username{
    color:var(--muted);
    margin-top:3px;
}

.bio{
    color:var(--muted);
    max-width:500px;
    margin:15px auto;
    line-height:1.5;
}

.stats{
    display:flex;
    justify-content:center;
    gap:45px;
    margin:20px 0;
}

.stat strong{
    display:block;
    font-size:21px;
}

.stat span{
    color:var(--muted);
    font-size:13px;
}

.outline{
    border:1px solid var(--border);
    background:var(--card);
    color:var(--text);
    border-radius:12px;
    padding:10px 16px;
    font-weight:800;
}

.outline:hover{
    background:var(--bg);
}

/* SEARCH */

.search-card{
    padding:18px;
    margin-bottom:18px;
}

.search-input{
    width:100%;
    padding:14px;
    border:1px solid var(--border);
    border-radius:13px;
    background:var(--card);
    color:var(--text);
    outline:none;
    margin-top:12px;
}

.user-result{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    background:var(--card);
    border:1px solid var(--border);
    padding:14px;
    border-radius:16px;
    margin-bottom:10px;
}

.user-info{
    display:flex;
    align-items:center;
    gap:10px;
    min-width:0;
}

.user-name{
    font-weight:800;
}

.user-handle{
    color:var(--muted);
    font-size:13px;
}

.open-btn{
    border:0;
    background:var(--blue);
    color:white;
    border-radius:10px;
    padding:9px 13px;
    font-weight:800;
}

/* RIGHT */

.info-card{
    padding:18px;
}

.info-card h3{
    margin-bottom:10px;
}

.info-card p{
    color:var(--muted);
    line-height:1.5;
}

/* MODAL */

.modal{
    position:fixed;
    inset:0;
    z-index:100;
    background:rgba(0,0,0,.6);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.modal-box{
    width:100%;
    max-width:500px;
    background:var(--card);
    border-radius:22px;
    padding:24px;
    box-shadow:0 25px 80px rgba(0,0,0,.3);
}

.modal-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:18px;
}

.close{
    border:0;
    background:var(--bg);
    color:var(--text);
    width:35px;
    height:35px;
    border-radius:50%;
    font-size:20px;
}

/* LOADING */

.loading{
    text-align:center;
    padding:50px;
    color:var(--muted);
}

/* TOAST */

.toast{
    position:fixed;
    bottom:25px;
    left:50%;
    transform:translateX(-50%) translateY(100px);
    background:#111827;
    color:white;
    padding:13px 18px;
    border-radius:13px;
    z-index:200;
    transition:.3s;
    opacity:0;
}

.toast.show{
    transform:translateX(-50%) translateY(0);
    opacity:1;
}

/* MOBILE */

@media(max-width:900px){

    .layout{
        grid-template-columns:1fr;
        max-width:700px;
    }

    .sidebar,
    .rightbar{
        display:none;
    }

    .mobile-label{
        display:none;
    }
}

@media(max-width:600px){

    .navbar{
        padding:0 10px;
    }

    .nav-logo{
        font-size:22px;
    }

    .nav-btn{
        padding:8px;
    }

    .layout{
        padding:12px 9px 40px;
    }

    .create-card,
    .post,
    .profile-card{
        border-radius:16px;
    }

    .post{
        padding:15px;
    }

    .stats{
        gap:25px;
    }

    .auth-card{
        padding:25px;
        border-radius:22px;
    }
}
</style>
</head>

<body>

<!-- AUTH -->

<section id="authPage" class="auth-page">

    <div class="auth-card">

        <div class="logo">
            Nur<span>link</span>
        </div>

        <div class="tagline">
            Твоя сеть. Твои люди. Твой мир.
        </div>

        <!-- LOGIN -->

        <div id="loginBox">

            <h2 class="auth-title">
                Добро пожаловать 👋
            </h2>

            <input
                id="loginEmail"
                class="input"
                type="email"
                placeholder="Email"
            >

            <input
                id="loginPassword"
                class="input"
                type="password"
                placeholder="Пароль"
            >

            <button
                class="primary"
                onclick="login()"
            >
                Войти
            </button>

            <div class="auth-switch">
                Нет аккаунта?
                <button
                    class="link-btn"
                    onclick="showRegister()"
                >
                    Зарегистрироваться
                </button>
            </div>

        </div>


        <!-- REGISTER -->

        <div id="registerBox" class="hidden">

            <h2 class="auth-title">
                Создать аккаунт 🚀
            </h2>

            <input
                id="regName"
                class="input"
                placeholder="Имя"
                maxlength="40"
            >

            <input
                id="regUsername"
                class="input"
                placeholder="Username"
                maxlength="20"
            >

            <input
                id="regEmail"
                class="input"
                type="email"
                placeholder="Email"
            >

            <input
                id="regPassword"
                class="input"
                type="password"
                placeholder="Пароль"
            >

            <button
                class="primary"
                onclick="register()"
            >
                Создать аккаунт
            </button>

            <div class="auth-switch">
                Уже есть аккаунт?
                <button
                    class="link-btn"
                    onclick="showLogin()"
                >
                    Войти
                </button>
            </div>

        </div>

    </div>

</section>


<!-- APP -->

<section id="app" class="hidden">

    <nav class="navbar">

        <div
            class="nav-logo"
            onclick="showFeed()"
            style="cursor:pointer"
        >
            Nur<span>link</span>
        </div>

        <div class="nav-actions">

            <button
                class="nav-btn"
                onclick="showFeed()"
            >
                🏠 <span class="mobile-label">Главная</span>
            </button>

            <button
                class="nav-btn"
                onclick="showSearch()"
            >
                🔎 <span class="mobile-label">Поиск</span>
            </button>

            <button
                class="nav-btn"
                onclick="showProfile()"
            >
                👤 <span class="mobile-label">Профиль</span>
            </button>

            <button
                class="nav-btn"
                onclick="toggleDark()"
                title="Тёмная тема"
            >
                🌙
            </button>

            <button
                class="nav-btn"
                onclick="logout()"
            >
                🚪
            </button>

        </div>

    </nav>


    <div class="layout">

        <!-- LEFT -->

        <aside class="sidebar">

            <div class="side-card">

                <div
                    id="sideUser"
                    class="side-user"
                ></div>

                <div class="side-menu">

                    <button onclick="showFeed()">
                        🏠 Главная
                    </button>

                    <button onclick="showSearch()">
                        🔎 Найти людей
                    </button>

                    <button onclick="showProfile()">
                        👤 Мой профиль
                    </button>

                    <button onclick="openEdit()">
                        ✏️ Редактировать
                    </button>

                </div>

            </div>

        </aside>


        <!-- MAIN -->

        <main id="content" class="main">

        </main>


        <!-- RIGHT -->

        <aside class="rightbar">

            <div class="info-card">

                <h3>✨ Nurlink</h3>

                <p>
                    Общайся, делись моментами
                    и находи новых людей.
                </p>

                <br>

                <p>
                    Nurlink 6.0
                </p>

            </div>

        </aside>

    </div>

</section>


<!-- EDIT MODAL -->

<div
    id="editModal"
    class="modal hidden"
>

    <div class="modal-box">

        <div class="modal-head">

            <h2>Мой профиль</h2>

            <button
                class="close"
                onclick="closeEdit()"
            >
                ×
            </button>

        </div>

        <input
            id="editName"
            class="input"
            placeholder="Имя"
            maxlength="40"
        >

        <input
            id="editAvatar"
            class="input"
            placeholder="Ссылка на аватар (необязательно)"
        >

        <textarea
            id="editBio"
            class="input"
            placeholder="Расскажи о себе..."
            maxlength="300"
        ></textarea>

        <button
            class="primary"
            onclick="saveProfile()"
        >
            Сохранить изменения
        </button>

    </div>

</div>


<!-- TOAST -->

<div
    id="toast"
    class="toast"
></div>


<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
"https://yaycdogysqslorprxhgs.supabase.co";

const SUPABASE_KEY =
"sb_publishable_zby9kHgYS0i-KTBFKswqDA_P2XMlWuy";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =========================================
   GLOBAL
========================================= */

let currentUser = null;
let currentProfile = null;
let selectedImage = null;


/* =========================================
   HELPERS
========================================= */

function $(id){
    return document.getElementById(id);
}


function escapeHTML(text){

    if(text === null || text === undefined)
        return "";

    return String(text)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}


function toast(text){

    $("toast").textContent = text;

    $("toast").classList.add("show");

    setTimeout(()=>{
        $("toast").classList.remove("show");
    },2500);
}


function avatarHTML(profile, size="normal"){

    const cls =
        size === "large"
        ? "avatar large"
        : size === "small"
        ? "avatar small"
        : "avatar";

    if(profile && profile.avatar_url){

        return `
            <div class="${cls}">
                <img
                    src="${escapeHTML(profile.avatar_url)}"
                    onerror="this.style.display='none'"
                >
            </div>
        `;

    }

    const name =
        profile?.display_name ||
        profile?.username ||
        "?";

    return `
        <div class="${cls}">
            ${escapeHTML(
                name.charAt(0).toUpperCase()
            )}
        </div>
    `;
}


function timeAgo(date){

    const seconds =
        Math.floor(
            (Date.now() -
            new Date(date).getTime()) / 1000
        );

    if(seconds < 60)
        return "только что";

    if(seconds < 3600)
        return Math.floor(seconds/60)+" мин";

    if(seconds < 86400)
        return Math.floor(seconds/3600)+" ч";

    return Math.floor(seconds/86400)+" дн";
}


/* =========================================
   DARK MODE
========================================= */

function toggleDark(){

    document.body.classList.toggle("dark");

    localStorage.setItem(
        "nurlink_dark",
        document.body.classList.contains("dark")
    );

}


if(localStorage.getItem("nurlink_dark")==="true"){
    document.body.classList.add("dark");
}


/* =========================================
   AUTH UI
========================================= */

function showRegister(){

    $("loginBox").classList.add("hidden");
    $("registerBox").classList.remove("hidden");

}


function showLogin(){

    $("registerBox").classList.add("hidden");
    $("loginBox").classList.remove("hidden");

}


function showApp(){

    $("authPage").classList.add("hidden");
    $("app").classList.remove("hidden");

}


function showAuth(){

    $("app").classList.add("hidden");
    $("authPage").classList.remove("hidden");

}


/* =========================================
   REGISTER
========================================= */

async function register(){

    const name =
        $("regName").value.trim();

    const username =
        $("regUsername")
        .value
        .trim()
        .toLowerCase();

    const email =
        $("regEmail").value.trim();

    const password =
        $("regPassword").value;


    if(!name ||
       !username ||
       !email ||
       !password){

        toast("Заполни все поля");

        return;
    }


    if(!/^[a-z0-9_]+$/.test(username)){

        toast(
            "Username: только английские буквы, цифры и _"
        );

        return;
    }


    if(password.length < 6){

        toast(
            "Пароль должен быть минимум 6 символов"
        );

        return;
    }


    const {data: existing} =
        await supabaseClient
        .from("profiles")
        .select("id")
        .eq("username",username)
        .maybeSingle();


    if(existing){

        toast("Этот username уже занят");

        return;
    }


    const {data,error} =
        await supabaseClient.auth.signUp({

            email,

            password,

            options:{
                data:{
                    display_name:name,
                    username:username
                }
            }

        });


    if(error){

        toast(error.message);

        return;
    }

/* =========================================
   IMAGE PREVIEW
========================================= */

function previewImage(event){

    const file =
        event.target.files[0];

    if(!file)
        return;


    if(file.size > 8 * 1024 * 1024){

        toast("Фото должно быть меньше 8 МБ");

        event.target.value = "";

        return;
    }


    selectedImage = file;


    const reader =
        new FileReader();


    reader.onload = function(e){

        $("imagePreview").innerHTML = `
            <img src="${e.target.result}">
        `;

        $("imagePreview")
            .classList
            .remove("hidden");

    };


    reader.readAsDataURL(file);

}


/* =========================================
   UPLOAD IMAGE
========================================= */

async function uploadImage(file){

    const extension =
        file.name
        .split(".")
        .pop()
        .toLowerCase();


    const fileName =
        currentUser.id +
        "/" +
        crypto.randomUUID() +
        "." +
        extension;


    const {error} =
        await supabaseClient.storage
        .from("nurlink")
        .upload(
            fileName,
            file,
            {
                cacheControl:"3600",
                upsert:false
            }
        );


    if(error){

        console.error(error);

        throw error;

    }


    const {data} =
        supabaseClient.storage
        .from("nurlink")
        .getPublicUrl(fileName);


    return data.publicUrl;

}


/* =========================================
   CREATE POST
========================================= */

async function createPost(){

    const text =
        $("postText")
        .value
        .trim();


    if(!text && !selectedImage){

        toast("Добавь текст или фото");

        return;
    }


    let imageUrl = "";


    try{

        if(selectedImage){

            toast("Загружаю фото...");

            imageUrl =
                await uploadImage(
                    selectedImage
                );

        }


        const {error} =
            await supabaseClient
            .from("posts")
            .insert({

                user_id:currentUser.id,

                content:
                    text || "📷 Фото",

                image_url:imageUrl

            });


        if(error){

            /*
             If old database doesn't have
             image_url yet, tell the user.
            */

            if(
                error.message &&
                error.message
                .toLowerCase()
                .includes("image_url")
            ){

                toast(
                    "Нужно добавить image_url в таблицу posts"
                );

                return;
            }


            throw error;

        }


        $("postText").value = "";

        selectedImage = null;

        $("postImage").value = "";

        $("imagePreview")
            .classList
            .add("hidden");


        toast("Пост опубликован 🚀");

        await loadPosts();


    }catch(error){

        console.error(error);

        toast(error.message);

    }

}


/* =========================================
   LOAD POSTS
========================================= */

async function loadPosts(){

    const feed =
        $("feed");


    if(!feed)
        return;


    /*
       Try to get image_url.
    */

    let result =
        await supabaseClient
        .from("posts")
        .select(`
            *,
            profiles(
                id,
                username,
                display_name,
                avatar_url
            )
        `)
        .order(
            "created_at",
            {
                ascending:false
            }
        );


    /*
       If image_url doesn't exist,
       load without it.
    */

    if(
        result.error &&
        result.error.message
        .toLowerCase()
        .includes("image_url")
    ){

        result =
            await supabaseClient
            .from("posts")
            .select(`
                *,
                profiles(
                    id,
                    username,
                    display_name,
                    avatar_url
                )
            `)
            .order(
                "created_at",
                {
                    ascending:false
                }
            );

    }


    if(result.error){

        feed.innerHTML = `
            <div class="post">
                <b>Ошибка загрузки</b>
                <p style="color:var(--muted);margin-top:8px">
                    ${escapeHTML(
                        result.error.message
                    )}
                </p>
            </div>
        `;

        return;
    }


    const posts =
        result.data || [];


    if(!posts.length){

        feed.innerHTML = `
            <div class="post">

                <h3>
                    Здесь пока пусто 👀
                </h3>

                <p style="
                    color:var(--muted);
                    margin-top:8px;
                ">
                    Создай первый пост Nurlink!
                </p>

            </div>
        `;

        return;
    }


    feed.innerHTML = "";


    for(const post of posts){

        const likes =
            await getLikes(post.id);

        const comments =
            await getComments(post.id);


        const liked =
            likes.some(
                x =>
                x.user_id ===
                currentUser.id
            );


        const profile =
            post.profiles;


        const element =
            document.createElement("article");


        element.className = "post";


        element.innerHTML = `

            <div class="post-header">

                ${avatarHTML(profile)}

                <div>

                    <div class="post-author">
                        ${escapeHTML(
                            profile?.display_name ||
                            profile?.username ||
                            "User"
                        )}
                    </div>

                    <div class="post-username">
                        @${escapeHTML(
                            profile?.username || ""
                        )}
                    </div>

                    <div class="post-date">
                        ${timeAgo(post.created_at)}
                    </div>

                </div>

            </div>


            <div class="post-content">
                ${escapeHTML(post.content)}
            </div>


            ${
                post.image_url
                ?
                `
                <img
                    class="post-image"
                    src="${escapeHTML(
                        post.image_url
                    )}"
                    loading="lazy"
                >
                `
                :
                ""
            }


            <div class="post-actions">

                <button
                    class="action ${liked ? "liked" : ""}"
                    onclick="
                        toggleLike(
                            ${post.id},
                            ${liked}
                        )
                    "
                >
                    ❤️ ${likes.length}
                </button>


                <button
                    class="action"
                    onclick="
                        toggleComments(
                            ${post.id}
                        )
                    "
                >
                    💬 ${comments.length}
                </button>


                ${
                    post.user_id === currentUser.id
                    ?
                    `
                    <button
                        class="action delete"
                        onclick="
                            deletePost(
                                ${post.id}
                            )
                        "
                    >
                        🗑️
                    </button>
                    `
                    :
                    ""
                }

            </div>


            <div
                id="comments-${post.id}"
                class="comments hidden"
            >

                <div
                    id="comment-list-${post.id}"
                >
                    ${renderComments(comments)}
                </div>


                <div class="comment-input-row">

                    <input
                        id="comment-input-${post.id}"
                        class="comment-input"
                        placeholder="Написать комментарий..."
                        maxlength="300"
                    >

                    <button
                        class="comment-send"
                        onclick="
                            addComment(
                                ${post.id}
                            )
                        "
                    >
                        ➤
                    </button>

                </div>

            </div>

        `;


        feed.appendChild(element);

    }

}


/* =========================================
   LIKES
========================================= */

async function getLikes(postId){

    const {data,error} =
        await supabaseClient
        .from("likes")
        .select("user_id")
        .eq(
            "post_id",
            postId
        );


    if(error){

        console.error(error);

        return [];

    }


    return data || [];

}


async function toggleLike(postId,liked){

    if(liked){

        await supabaseClient
        .from("likes")
        .delete()
        .eq(
            "post_id",
            postId
        )
        .eq(
            "user_id",
            currentUser.id
        );

    }else{

        const {error} =
            await supabaseClient
            .from("likes")
            .insert({

                post_id:postId,

                user_id:currentUser.id

            });


        if(error){

            toast(error.message);

            return;
        }

    }


    await loadPosts();

}


/* =========================================
   COMMENTS
========================================= */

async function getComments(postId){

    const {data,error} =
        await supabaseClient
        .from("comments")
        .select(`
            *,
            profiles(
                username,
                display_name,
                avatar_url
            )
        `)
        .eq(
            "post_id",
            postId
        )
        .order(
            "created_at",
            {
                ascending:true
            }
        );


    if(error){

        console.error(error);

        return [];

    }


    return data || [];

}


function renderComments(comments){

    if(!comments.length){

        return `
            <div style="
                color:var(--muted);
                padding:8px 0;
            ">
                Пока нет комментариев.
            </div>
        `;

    }


    return comments.map(comment=>`

        <div class="comment">

            ${avatarHTML(
                comment.profiles,
                "small"
            )}

            <div class="comment-content">

                <div class="comment-name">
                    ${escapeHTML(
                        comment.profiles
                        ?.display_name ||
                        comment.profiles
                        ?.username ||
                        "User"
                    )}
                </div>

                <div>
                    ${escapeHTML(
                        comment.content
                    )}
                </div>

            </div>

        </div>

    `).join("");

}


function toggleComments(postId){

    const box =
        $(
            "comments-" +
            postId
        );


    if(box)
        box.classList.toggle("hidden");

}


async function addComment(postId){

    const input =
        $(
            "comment-input-" +
            postId
        );


    const text =
        input.value.trim();


    if(!text)
        return;


    const {error} =
        await supabaseClient
        .from("comments")
        .insert({

            post_id:postId,

            user_id:currentUser.id,

            content:text

        });


    if(error){

        toast(error.message);

        return;
    }


    input.value = "";

    await loadPosts();

}


/* =========================================

async function deletePost(postId){

    if(

        .from("posts")
        .delete()

    clearTimeout(searchTimeout);

async function performSearch(){

    const input =
        $("searchInput");


    if(!input)
        return;


    const query =
        input.value
        .trim()
        .toLowerCase();


    const results =
        $("searchResults");


    if(!query){

        results.innerHTML = "";

        return;
    }


    const {data,error} =
        await supabaseClient
        .from("profiles")
        .select("*")
        .or(
            `username.ilike.%${query}%,display_name.ilike.%${query}%`

    if(error){

        results.innerHTML = `

                ${escapeHTML(
                    error.message

        return;

    const users =
        (data || [])
        .filter(

        results.innerHTML = `

            </div>


            <button
                class="primary"
                style="max-width:280px"
                onclick="
                    toggleFollow(
                        '${user.id}',
                        ${isFollowing}
                    )
                "
            >
                ${
                    isFollowing
                    ?
                    "Отписаться"
                    :
                    "Подписаться"
                }
            </button>

        </div>


        <div id="otherUserPosts"></div>

    `;


    await loadUserPosts(
        userId,
        "otherUserPosts"
    );

}


/* =========================================
   FOLLOW
========================================= */

async function countFollowers(userId){

    const {count,error} =
        await supabaseClient
        .from("follows")
        .select(
            "*",
            {
                count:"exact",
                head:true
            }
        )
        .eq(
            "following_id",
            userId
        );


    if(error)
        return 0;


    return count || 0;

}


async function countFollowing(userId){

    const {count,error} =
        await supabaseClient
        .from("follows")
        .select(
            "*",
            {
                count:"exact",
                head:true
            }
        )
        .eq(
            "follower_id",
            userId
        );


    if(error)
        return 0;


    return count || 0;

}


async function toggleFollow(
    userId,
    following
){

    if(following){

        const {error} =
            await supabaseClient
            .from("follows")
            .delete()
            .eq(
                "follower_id",
                currentUser.id
            )
            .eq(
                "following_id",
                userId
            );


        if(error){

            toast(error.message);

            return;
        }


        toast("Ты отписался");

    }else{

        const {error} =
            await supabaseClient
            .from("follows")
            .insert({

                follower_id:
                    currentUser.id,

                following_id:
                    userId

            });


        if(error){

            toast(error.message);

            return;
        }


        toast("Ты подписался 🎉");

    }


    await viewUser(userId);

}


/* =========================================
   AUTH STATE
========================================= */

supabaseClient.auth.onAuthStateChange(
    async (event,session)=>{

        if(session){

            currentUser =
                session.user;

            await loadApp();

        }

    }
);


/* =========================================
   START
========================================= */

(async function(){

    const {
        data:{
            session
        }
    } =
        await supabaseClient
        .auth
        .getSession();


    if(session){

        currentUser =
            session.user;

        await loadApp();

    }else{

        showAuth();

    }

})();

</script>
